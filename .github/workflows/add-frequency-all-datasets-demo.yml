# ─────────────────────────────────────────────────────────────
# Workflow : addTagCulture (demo)
# But : Ajouter le tag "Culture" à tous les jeux de données
#       d’une organisation DataGouv (environnement DEMO)
#
# ⚙️ Ce workflow exécute le script Python :
#     DataGouv/scripts/add_tag_culture.py
#
# 🔐 Secrets requis :
#   - DEMO_DATA_GOUV_KEY : clé API pour https://demo.data.gouv.fr
#
# 💡 Remarques :
# - Le script utilise la variable d’environnement DATAGOUV_ENV
#   pour choisir l’environnement (ici "demo").
# - Aucun changement réel n’est effectué tant que UPDATE_MODE=False
#   dans le script Python.
# - Un fichier de backup (backup_tags.json) peut être commité automatiquement.
# ─────────────────────────────────────────────────────────────

name: addTagCulture (demo)

on:
  workflow_dispatch:

permissions:
  contents: write  # nécessaire pour le git push

jobs:
  add-tag-culture:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # évite les problèmes lors du push

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install datagouv-client httpx

      - name: 🚀 Exécution du script d’ajout de tag (DEMO)
        env:
          DATAGOUV_ENV: demo
          DEMO_DATA_GOUV_KEY: ${{ secrets.DEMO_DATA_GOUV_KEY }}
        run: |
          echo "───────────────────────────────"
          echo "Lancement du script add_tag_culture.py sur DEMO..."
          echo "───────────────────────────────"
          python DataGouv/scripts/add_tag_culture.py

      - name: 🗂️ Commit & push backup file (si présent)
        if: success()  # n'exécuter cette étape que si le script a réussi
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "🔍 Vérification du fichier de backup..."
          BACKUP_PATH="DataGouv/scripts/backup_tags.json"

          if [ -f "$BACKUP_PATH" ]; then
            echo "✅ Fichier de backup détecté : $BACKUP_PATH"
            git fetch origin main
            git checkout main

            git add "$BACKUP_PATH"
            git commit -m "chore: update backup_tags.json [skip ci]" || echo "Aucune modification à commettre"
            git push origin main
            echo "📤 Backup commité et poussé avec succès."
          else
            echo "ℹ️ Aucun fichier de backup trouvé, rien à commettre."
          fi

      - name: ✅ Fin du workflow
        run: |
          echo "───────────────────────────────"
          echo "Workflow addTagCulture (demo) terminé."
          echo "───────────────────────────────"
