name: Analyse sémantique MetaMC

on:
  workflow_dispatch:  # Exécution manuelle uniquement

jobs:
  semantique_metamc:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout du dépôt
      uses: actions/checkout@v3

    - name: 🐍 Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests openai

    - name: 🚀 Exécution du script d’analyse sémantique
      run: |
        python CartoDataMC/MetaMc_analyse_semantique.py
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
