name: Extraction colonnes via Tabular API

on:
  workflow_dispatch:  # Lancement manuel uniquement

jobs:
  extraction_colonnes:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout du dépôt
      uses: actions/checkout@v3

    - name: 🐍 Configuration de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: 🚀 Lancer le script d'extraction Tabular
      run: |
        python CartoDataMC/extraction_colonnes_tabular.py

    - name: 📤 Commit et push des résultats
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add CartoDataMC/cartographie_ressources_datasets_proprietes.csv
        git commit -m "🧾 MAJ colonnes via Tabular API"
        git push
      continue-on-error: true
