name: Backup DataGouv Tags

on:
  workflow_dispatch: # exécution manuelle uniquement

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dépendances
        run: |
          pip install datagouv-client

      - name: Run backup script
        run: |
          python DataGouv/scripts/backupTags.py

      - name: Commit & push backup file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Synchroniser la branche locale avec main
          git fetch origin main
          git checkout main
          git pull --rebase origin main

          # Ajouter le backup
          git add DataGouv/scripts/backup_tags.json
          git commit -m "chore: update backup_tags.json [skip ci]" || echo "No changes to commit"

          git push origin main
