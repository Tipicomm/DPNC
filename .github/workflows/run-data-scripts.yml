name: Exécuter scripts DataGouv

on:
  workflow_dispatch:        # déclenchement manuel
  push:
    branches:
      - main                # ou la branche que tu veux

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install --upgrade pip
          pip install requests pandas openpyxl datagouv-client

      - name: Exécuter les scripts Python
        working-directory: DataGouv/scripts
        env:
          DATAGOUV_API_KEY: ${{ secrets.DATAGOUV_API_KEY }}
        run: |
          for script in *.py; do
            echo ">>> Exécution du script : $script"
            python "$script"
            echo ">>> Fin du script $script"
          done

      - name: Upload backup (si script backup créé backup_tags.json)
        uses: actions/upload-artifact@v4
        with:
          name: backup-datagouv
          path: DataGouv/scripts/backup_tags.json
