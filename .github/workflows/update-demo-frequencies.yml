name: 🔁 Mise à jour des fréquences DEMO depuis PROD

on:
  workflow_dispatch:

jobs:
  update_frequencies:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          pip install datagouv-client httpx requests

      - name: 💾 Exécution du script de mise à jour des fréquences
        env:
          DEMO_DATA_GOUV_KEY: ${{ secrets.DEMO_DATA_GOUV_KEY }}
        run: |
          python DataGouv/scripts/update_demo_frequencies_from_prod.py

      - name: 🧾 Vérification du fichier de sauvegarde
        run: |
          echo "📁 Contenu du dossier DataGouv/scripts/backup/"
          ls -lh DataGouv/scripts/backup/
          echo "🔍 Aperçu du fichier :"
          head -n 40 DataGouv/scripts/backup/backup_demo_frequency_updates.json || echo "⚠️ Fichier introuvable."
