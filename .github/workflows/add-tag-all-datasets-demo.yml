# ─────────────────────────────────────────────────────────────
# Workflow : addTagAll
# But : Ajouter le tag "culture" à tous les jeux de données
#       d’une organisation DataGouv (DEMO ou PROD selon choix)
#
# ⚙️ Ce workflow exécute le script Python :
#     DataGouv/scripts/addTagAllDemo.py
#
# 🔐 Secrets requis :
#   - DEMO_DATA_GOUV_KEY : clé API pour https://demo.data.gouv.fr
#   - DATAGOUV_API_KEY : clé API pour https://data.gouv.fr
#
# 💡 Paramètres configurables à l’exécution :
#   - environment : "demo" ou "www"
#   - update_mode : "True" (écriture) ou "False" (simulation)
#
# ✅ Le script lit DATAGOUV_ENV et UPDATE_MODE depuis ces entrées.
# ─────────────────────────────────────────────────────────────

name: addTagAll

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible (demo ou www)"
        required: true
        default: "demo"
      update_mode:
        description: "Mode de mise à jour (True = écriture réelle, False = simulation)"
        required: true
        default: "False"

permissions:
  contents: write  # nécessaire pour le git push du backup

jobs:
  add-tag-culture:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # évite les problèmes lors du push

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install datagouv-client httpx

      - name: 🚀 Exécution du script addTagAllDemo.py
        env:
          DATAGOUV_ENV: ${{ github.event.inputs.environment }}
          UPDATE_MODE: ${{ github.event.inputs.update_mode }}
          DEMO_DATA_GOUV_KEY: ${{ secrets.DEMO_DATA_GOUV_KEY }}
          DATAGOUV_API_KEY: ${{ secrets.DATAGOUV_API_KEY }}
        run: |
          echo "───────────────────────────────"
          echo "Lancement du script addTagAllDemo.py"
          echo "Environnement : $DATAGOUV_ENV"
          echo "Mode : $UPDATE_MODE"
          echo "───────────────────────────────"
          python DataGouv/scripts/addTagAllDemo.py

      - name: 🗂️ Commit & push backup file (si présent)
        if: success()  # seulement si le script s’est bien exécuté
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BACKUP_PATH="DataGouv/scripts/backup_tags.json"
          echo "🔍 Vérification du fichier de backup..."

          if [ -f "$BACKUP_PATH" ]; then
            echo "✅ Fichier de backup détecté : $BACKUP_PATH"
            git fetch origin main
            git checkout main
            git add "$BACKUP_PATH"
            git commit -m "chore: update backup_tags.json [skip ci]" || echo "Aucune modification à commettre"
            git push origin main
            echo "📤 Backup commité et poussé avec succès."
          else
            echo "ℹ️ Aucun fichier de backup trouvé, rien à commettre."
          fi

      - name: ✅ Fin du workflow
        run: |
          echo "───────────────────────────────"
          echo "Workflow addTagAll terminé."
          echo "───────────────────────────────"
