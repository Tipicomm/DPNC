name: 📊 Extraction et enrichissement des propriétés CSV - CartoDataMC

on:
  workflow_dispatch:

jobs:
  extraction:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v3

      - name: 🐍 Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Installer les dépendances
        run: pip install pandas requests

      - name: 🔍 Exécuter le script d’extraction et enrichissement
        run: python CartoDataMC/extraction_properties.py

      - name: 💾 Commit des fichiers enrichis
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add CartoDataMC/cartographie_culture_properties.csv
          git commit -m '🔄 Mise à jour des propriétés enrichies depuis /profile'
          git push
