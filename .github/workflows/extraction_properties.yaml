name: 🧩 Extraction des propriétés CSV - CartoDataMC
on:
  workflow_dispatch:
  push:
    paths:
      - 'CartoDataMC/cartographie_culture_properties.csv'
      - 'CartoDataMC/extraction_properties.py'
      - '.github/workflows/extraction_properties.yml'

jobs:
  enrichissement:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Récupération du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install pandas requests

      - name: 🧠 Enrichissement des propriétés avec Tabular
        run: python CartoDataMC/extraction_properties.py

      - name: 💾 Commit des propriétés enrichies
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add CartoDataMC/cartographie_culture_properties_exemples.csv
          git commit -m '🔄 Mise à jour des propriétés enrichies via extraction_properties.py' || echo "✅ Rien à committer"
          git push
