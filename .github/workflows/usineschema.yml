name: UsineSchema - Étapes 1 & 2

on:
  workflow_dispatch:   # lancement manuel
  push:
    paths:
      - "UsineSchema/Ressource_Contexte_Etape1.py"
      - "UsineSchema/Add_Prompt_Definition_Etape2.py"
      - ".github/workflows/usineschema.yml"

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # nécessaire pour pouvoir pousser
          fetch-depth: 0              # nécessaire pour commit

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openai

      - name: ▶️ Étape 1 - Générer le contexte
        run: |
          python UsineSchema/Ressource_Contexte_Etape1.py

      - name: ▶️ Étape 2 - Ajouter définitions
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m UsineSchema.Add_Prompt_Definition_Etape2


      - name: 📂 Vérifier fichiers générés
        run: ls -lh UsineSchema/

      - name: 📤 Commit et push du fichier enrichi
        run: |
         git config --global user.name "github-actions[bot]"
         git config --global user.email "github-actions[bot]@users.noreply.github.com"
         git add UsineSchema/schema_enrichi_*.csv
         git commit -m "Ajout auto du fichier enrichi (workflow)" || echo "Aucun changement à commit"
         git push origin HEAD:main --force

      - name: 📦 Sauvegarder résultats en artefacts (optionnel)
        uses: actions/upload-artifact@v4
        with:
          name: schemas-complets
          path: UsineSchema/*.csv
