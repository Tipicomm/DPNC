name: 📥 Exemples de valeurs - Cartographie Culture

on:
  workflow_dispatch:

jobs:
  exemples-valeurs:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Récupération du dépôt
        uses: actions/checkout@v3

      - name: 🐍 Installation de Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Installation des dépendances
        run: pip install pandas requests

      - name: 🔍 Exécution du script d’extraction des exemples
        run: python CartoDataMC/exemples_proprietes.py

      - name: 💾 Commit des résultats
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add CartoDataMC/cartographie_culture_properties_exemples.csv
          git commit -m "📥 Ajout d’exemples de valeurs pour les propriétés"
          git push
        continue-on-error: true
