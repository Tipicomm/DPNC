name: Enrichissement des propriétés (avec typage)

on:
  workflow_dispatch:

jobs:
  enrichissement:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v3

      - name: 🐍 Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Installer les dépendances
        run: pip install pandas requests

      - name: 🔍 Exécution du script enrichi
        run: |
          echo "Démarrage du script d'enrichissement"
          python CartoDataMC/exemples_proprietes.py

      - name: 💾 Commit des fichiers enrichis (si changements)
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add CartoDataMC/cartographie_culture_properties_exemples.csv
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m 'Mise à jour des exemples de propriétés enrichis'
            git push
          fi
