name: 🔄 Backup Properties Datasets (demo)

on:
  workflow_dispatch:   # exécution manuelle possible
  schedule:
    - cron: "0 5 1 * *"  # exécution automatique le 1er de chaque mois à 05h00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          pip install datagouv-client requests

      - name: 💾 Exécution du script de sauvegarde complète
        env:
          DATAGOUV_ENV: demo
        run: |
          mkdir -p DataGouv/scripts/backup/
          BACKUP_FILENAME="backup_datasets_full_$(date -u +'%Y_%m_%d').json"
          echo "🗓️ Nom du fichier de sauvegarde : $BACKUP_FILENAME"
          python DataGouv/scripts/backUpProperties.py --output "DataGouv/scripts/backup/$BACKUP_FILENAME"

      - name: 🧾 Vérification du fichier généré
        run: |
          echo "📁 Contenu du dossier DataGouv/scripts/backup/"
          ls -lh DataGouv/scripts/backup/
          echo "🔍 Aperçu du fichier de sauvegarde :"
          head -n 40 DataGouv/scripts/backup/backup_datasets_full_$(date -u +'%Y_%m_%d').json || echo "⚠️ Fichier introuvable"

      - name: 🪣 Commit et push du fichier de sauvegarde
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          git add DataGouv/scripts/backup/
          git commit -m "🧾 Backup DataGouv $(date -u +"%Y-%m-%d %H:%M:%S")" || echo "Aucun changement à committer"

          git push origin main --force
