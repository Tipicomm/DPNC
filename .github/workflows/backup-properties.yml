name: 🔄 Backup Properties Datasets DataGouv MC

on:
  workflow_dispatch:   # Exécution manuelle
  schedule:
    - cron: "0 5 1 * *"  # Exécution automatique le 1er de chaque mois à 05h00 UTC

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          pip install datagouv-client requests

      - name: 💾 Exécution du script de sauvegarde complète
        run: |
          python DataGouv/scripts/backUpProperties.py

      - name: 🧾 Vérification du fichier généré
        run: |
          echo "📁 Contenu du dossier DataGouv/scripts/backup/"
          ls -lh DataGouv/scripts/backup/
          echo "🔍 Aperçu du dernier fichier de sauvegarde :"
          ls -t DataGouv/scripts/backup/ | head -n 1 | xargs -I {} head -n 40 "DataGouv/scripts/backup/{}"

      - name: 🪣 Commit et push du fichier de sauvegarde
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          git add DataGouv/scripts/backup/
          git commit -m "🧾 Backup DataGouv (auto) $(date -u +"%Y-%m-%d %H:%M:%S")" || echo "Aucun changement à committer"
          git push origin main
