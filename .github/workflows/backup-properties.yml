name: 🔄 Backup complet DataGouv (demo)

on:
  workflow_dispatch:  # exécution manuelle uniquement

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # nécessaire pour pouvoir pousser ensuite

      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Installation des dépendances
        run: |
          pip install datagouv-client requests

      - name: 💾 Exécution du script de sauvegarde complète
        env:
          DATAGOUV_ENV: demo  # 🔁 Modifier en 'prod' ou 'dev' si besoin
        run: |
          python DataGouv/scripts/backUpProperties.py

      - name: 🧾 Vérification du fichier généré
        run: |
          echo "📁 Contenu du dossier DataGouv/scripts/"
          ls -lh DataGouv/scripts/
          echo "🔍 Aperçu du fichier de sauvegarde :"
          head -n 40 DataGouv/scripts/backup_datasets_full.json || echo "⚠️ Fichier introuvable"

      - name: 🪣 Commit et push du fichier de sauvegarde
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Vérifie et se place sur main
          git fetch origin main
          git checkout main

          # Ajout du fichier généré
          git add DataGouv/scripts/backup_datasets_full.json
          git commit -m "🧾 Backup DataGouv $(date -u +"%Y-%m-%d %H:%M:%S")" || echo "Aucun changement à committer"

          # Push sans rebase ni merge
          git push origin main --force
